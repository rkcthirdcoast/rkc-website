  RKC Third Coast would like to thank The Prairie School for being our official corner kick sponsor in 2026. The Prairie School in Wind Point is one of the finest private independent college preparatory day schools in the United States. Prairie serves students from early school and pre-kindergarten through grade 12. To learn more about their fantastic educational offerings, visit [prairieschool.com](https://prairieschool.com/) today.
